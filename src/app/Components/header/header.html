<mat-toolbar class="app-header">
  <span class="logo">Restaurante <strong>D'Kyara</strong></span>

  <span class="spacer"></span>

  <nav class="nav-links">
    <a mat-button routerLink="/" routerLinkActive="active">Inicio</a>
    <a mat-button routerLink="/carta" routerLinkActive="active">Carta</a>
    <a mat-button routerLink="/nosotros" routerLinkActive="active">Nosotros</a>
    <a mat-button routerLink="/contacto" routerLinkActive="active">Contacto</a>
  </nav>

    <!-- ✅ Mostrar carrito solo si hay usuario -->
    <a
      *ngIf="usuario"
      mat-icon-button
      routerLink="/carrito"
      aria-label="Ver carrito"
      class="carrito-icon"
    >
      <mat-icon>shopping_cart</mat-icon>
      <span class="carrito-badge" *ngIf="cantidadCarrito > 0">
        {{ cantidadCarrito }}
      </span>
    </a>

  <!-- Ícono y nombre de usuario -->
  <div class="user-info">
    <div *ngIf="usuario" class="username">
      {{ usuario.nombre | capitalizeFirst }}
    </div>
    <a
      mat-icon-button
      [routerLink]="usuario ? '/perfil' : '/login'"
      aria-label="Usuario"
      class="user-icon"
    >
      <mat-icon>account_circle</mat-icon>
    </a>
  </div>
</mat-toolbar>
